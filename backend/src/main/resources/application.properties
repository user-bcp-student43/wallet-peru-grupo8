quarkus.http.root-path=/api/v1
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${FRONTEND_ORIGIN:http://localhost:5173}
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=Accept,Authorization,Content-Type
quarkus.http.access-log.enabled=false

quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:wallet;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

quarkus.mailer.host=${SMTP_HOST:127.0.0.1}
quarkus.mailer.port=${SMTP_PORT:1025}
quarkus.mailer.from=wallet-demo@example.test
quarkus.mailer.mock=false

quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Wallet Onboarding API
quarkus.smallrye-openapi.info-version=1.0.0
onboarding.hmac.key=${ONBOARDING_HMAC_KEY}

%test.onboarding.hmac.key=test-only-hmac-key-never-use-for-real-data-0123456789
%test.quarkus.mailer.mock=true
%test.quarkus.http.test-port=0